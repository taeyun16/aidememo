name: update h2 lockfile

on:
  push:
    branches:
      - fix/h2-rustsec-2026-0258

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h2-rustsec-2026-0258
      - name: Update h2
        run: cargo update -p h2 --precise 0.4.16
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m 'fix(deps): update h2 to 0.4.16'
          git push origin HEAD:fix/h2-rustsec-2026-0258
