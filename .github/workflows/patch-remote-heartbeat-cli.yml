name: patch remote heartbeat CLI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/remote-handoff-lease'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remote-handoff-lease
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Integrate heartbeat CLI
        run: |
          python3 .github/scripts/patch_remote_heartbeat_cli.py
          cargo fmt --all
          cargo check -p aidememo-cli
          cargo test -p aidememo-domain handoff --lib
          cargo test -p aidememo-server --test handoff_lease_http
          cargo clippy -p aidememo-cli --bin aidememo -- -D warnings
          git diff --check
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/aidememo-cli/src/cmd/remote_handoff.rs
          git commit -m 'feat: connect remote handoff heartbeat'
          git push origin HEAD:agent/remote-handoff-lease
