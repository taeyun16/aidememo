name: PostgreSQL conformance

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/aidememo-domain/**"
      - "crates/aidememo-store-postgres/**"
      - ".github/workflows/postgres-conformance.yml"

permissions:
  contents: write

jobs:
  patch-concurrency-barrier:
    if: github.head_ref == 'agent/postgres-concurrency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/postgres-concurrency
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Spawn both tenant contenders before joining
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/aidememo-store-postgres/tests/postgres_concurrency.rs')
          text = path.read_text()
          old = '''    let barrier = Arc::new(Barrier::new(2));
    let first = spawn_execute(url.clone(), barrier.clone(), first_command)
        .join()
        .map_err(|_| "first tenant contender panicked")??;
    let second = spawn_execute(url.clone(), barrier, second_command)
        .join()
        .map_err(|_| "second tenant contender panicked")??;'''
          new = '''    let barrier = Arc::new(Barrier::new(2));
    let first = spawn_execute(url.clone(), barrier.clone(), first_command);
    let second = spawn_execute(url.clone(), barrier, second_command);
    let first = first
        .join()
        .map_err(|_| "first tenant contender panicked")??;
    let second = second
        .join()
        .map_err(|_| "second tenant contender panicked")??;'''
          if text.count(old) != 1:
              raise SystemExit('tenant barrier block changed')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo clippy -p aidememo-store-postgres --all-targets -- -D warnings
          git diff --check
      - name: Commit source-only barrier fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/aidememo-store-postgres/tests/postgres_concurrency.rs
          git commit -m 'test: start tenant contenders before barrier join'
          git push origin HEAD:agent/postgres-concurrency
