name: PostgreSQL conformance

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/aidememo-domain/**"
      - "crates/aidememo-store-postgres/**"
      - ".github/workflows/postgres-conformance.yml"

permissions:
  contents: write

jobs:
  patch-concurrency-lint:
    if: github.head_ref == 'agent/postgres-concurrency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/postgres-concurrency
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Remove read-only mut bindings
        run: |
          sed -i 's/let mut verify = PostgresCommandStore::connect_no_tls/let verify = PostgresCommandStore::connect_no_tls/g' crates/aidememo-store-postgres/tests/postgres_concurrency.rs
          cargo fmt --all
          cargo clippy -p aidememo-store-postgres --all-targets -- -D warnings
          test "$(grep -c 'let mut verify = PostgresCommandStore::connect_no_tls' crates/aidememo-store-postgres/tests/postgres_concurrency.rs || true)" -eq 0
          git diff --check
      - name: Commit source-only lint fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/aidememo-store-postgres/tests/postgres_concurrency.rs
          git commit -m 'test: remove redundant concurrency bindings'
          git push origin HEAD:agent/postgres-concurrency
