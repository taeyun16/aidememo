name: patch PostgreSQL migration lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/postgres-command-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/postgres-command-store
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Serialize PostgreSQL schema migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/aidememo-store-postgres/src/lib.rs')
          text = lib.read_text()
          old_const = 'const SCHEMA_VERSION: i32 = 1;\n'
          lock_const = '''const SCHEMA_VERSION: i32 = 1;
          // Stable application-scoped advisory lock key for canonical schema migration.
          // This serializes first-start DDL across multiple PostgreSQL connections.
          const SCHEMA_MIGRATION_LOCK_KEY: i64 = 0x4169_6465_4d65_6d6f;
          '''
          if 'SCHEMA_MIGRATION_LOCK_KEY' not in text:
              if text.count(old_const) != 1:
                  raise SystemExit('schema version constant changed')
              text = text.replace(old_const, lock_const, 1)

          start_marker = '    fn migrate(&self) -> Result<(), DomainError> {'
          end_marker = '    fn lock_client(&self) -> Result<MutexGuard<'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('migrate function boundaries changed')
          new_migrate = '''    fn migrate(&self) -> Result<(), DomainError> {
              let mut client = self.lock_client()?;
              let mut tx = client
                  .build_transaction()
                  .isolation_level(IsolationLevel::Serializable)
                  .start()
                  .map_err(|error| storage("schema_begin", error))?;
              tx.query_one(
                  "SELECT pg_advisory_xact_lock($1)",
                  &[&SCHEMA_MIGRATION_LOCK_KEY],
              )
              .map_err(|error| storage("schema_lock", error))?;
              tx.batch_execute(include_str!("schema.sql"))
                  .map_err(|error| storage("schema_create", error))?;
              tx.execute(
                  "INSERT INTO aidememo_schema (component, version)\n                 VALUES ($1, $2)\n                 ON CONFLICT (component) DO NOTHING",
                  &[&SCHEMA_COMPONENT, &SCHEMA_VERSION],
              )
              .map_err(|error| storage("schema_version_write", error))?;
              let version: i32 = tx
                  .query_one(
                      "SELECT version FROM aidememo_schema WHERE component = $1",
                      &[&SCHEMA_COMPONENT],
                  )
                  .map_err(|error| storage("schema_version_read", error))?
                  .get(0);
              if version != SCHEMA_VERSION {
                  return Err(DomainError::StorageFailure {
                      operation: "schema_version",
                      detail: format!(
                          "unsupported PostgreSQL canonical schema {version}; expected {SCHEMA_VERSION}"
                      ),
                  });
              }
              tx.commit()
                  .map_err(|error| storage("schema_commit", error))
          }

          '''
          text = text[:start] + new_migrate + text[end:]
          lib.write_text(text)

          test = Path('crates/aidememo-store-postgres/tests/postgres_contract.rs')
          text = test.read_text()
          if 'fn concurrent_schema_initialization_is_serialized()' not in text:
              anchor = '''#[test]
          #[ignore = "requires disposable PostgreSQL via AIDEMEMO_POSTGRES_URL"]
          fn handoff_mailbox_projection_tracks_canonical_lifecycle()'''
              regression = '''#[test]
          #[ignore = "requires disposable PostgreSQL via AIDEMEMO_POSTGRES_URL"]
          fn concurrent_schema_initialization_is_serialized()
          -> Result<(), Box<dyn std::error::Error>> {
              let url = std::env::var("AIDEMEMO_POSTGRES_URL")?;
              let first_url = url.clone();
              let second_url = url;
              let first = std::thread::spawn(move || PostgresCommandStore::connect_no_tls(&first_url));
              let second = std::thread::spawn(move || PostgresCommandStore::connect_no_tls(&second_url));
              let first = first.join().map_err(|_| "first PostgreSQL init thread panicked")??;
              let second = second.join().map_err(|_| "second PostgreSQL init thread panicked")??;
              assert_eq!(first.schema_version()?, 1);
              assert_eq!(second.schema_version()?, 1);
              Ok(())
          }

          #[test]
          #[ignore = "requires disposable PostgreSQL via AIDEMEMO_POSTGRES_URL"]
          fn handoff_mailbox_projection_tracks_canonical_lifecycle()'''
              if text.count(anchor) != 1:
                  raise SystemExit('handoff test anchor changed')
              text = text.replace(anchor, regression, 1)
          test.write_text(text)
          PY
          cargo fmt --all
          cargo test -p aidememo-store-postgres --no-run
          cargo clippy -p aidememo-store-postgres --all-targets -- -D warnings
          rm .github/workflows/patch-postgres-migration-lock.yml
          git diff --check
      - name: Commit migration lock fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: serialize PostgreSQL schema initialization'
          git push origin HEAD:agent/postgres-command-store
