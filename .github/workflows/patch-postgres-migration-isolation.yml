name: patch PostgreSQL migration isolation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/postgres-command-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/postgres-command-store
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Use read-committed migration transaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/aidememo-store-postgres/src/lib.rs')
          text = path.read_text()
          start = text.find('    fn migrate(&self) -> Result<(), DomainError> {')
          end = text.find('    fn lock_client(&self)', start)
          if start < 0 or end < 0:
              raise SystemExit('migration function boundaries changed')
          block = text[start:end]
          pattern = re.compile(
              r'let mut tx = client\s*'
              r'\.build_transaction\(\)\s*'
              r'\.isolation_level\(IsolationLevel::Serializable\)\s*'
              r'\.start\(\)\s*'
              r'\.map_err\(\|error\| storage\("schema_begin", error\)\)\?;'
          )
          replacement = '''// The advisory lock is the migration serializer. Keep the transaction at
              // PostgreSQL's default READ COMMITTED level so a waiter observes schema
              // metadata committed by the lock holder after it acquires the lock.
              let mut tx = client
                  .transaction()
                  .map_err(|error| storage("schema_begin", error))?;'''
          block, count = pattern.subn(replacement, block, count=1)
          if count != 1:
              raise SystemExit('migration serializable transaction pattern changed')
          path.write_text(text[:start] + block + text[end:])
          PY
          cargo fmt --all
          cargo test -p aidememo-store-postgres --no-run
          cargo clippy -p aidememo-store-postgres --all-targets -- -D warnings
          rm .github/workflows/patch-postgres-migration-isolation.yml
          git diff --check
      - name: Commit migration isolation fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: use read committed for migration lock waiters'
          git push origin HEAD:agent/postgres-command-store
