name: patch PostgreSQL migration isolation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/postgres-command-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/postgres-command-store
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Use read-committed migration transaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/aidememo-store-postgres/src/lib.rs')
          text = path.read_text()
          old = '''            let mut tx = client
                .build_transaction()
                .isolation_level(IsolationLevel::Serializable)
                .start()
                .map_err(|error| storage("schema_begin", error))?;'''
          new = '''            // The advisory lock is the migration serializer. Keep the transaction at
            // PostgreSQL's default READ COMMITTED level so a waiter observes schema
            // metadata committed by the lock holder after it acquires the lock.
            let mut tx = client
                .transaction()
                .map_err(|error| storage("schema_begin", error))?;'''
          if text.count(old) != 1:
              raise SystemExit('migration transaction block changed')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test -p aidememo-store-postgres --no-run
          cargo clippy -p aidememo-store-postgres --all-targets -- -D warnings
          rm .github/workflows/patch-postgres-migration-isolation.yml
          git diff --check
      - name: Commit migration isolation fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: use read committed for migration lock waiters'
          git push origin HEAD:agent/postgres-command-store
