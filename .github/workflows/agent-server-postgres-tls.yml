name: agent PostgreSQL TLS transport patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/agent_server_postgres_tls_patch.py"
      - ".github/workflows/agent-server-postgres-tls.yml"

permissions:
  contents: write

jobs:
  recover-verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/server-postgres-tls

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: agent-server-postgres-tls-v1

      - name: Recreate previously verified TLS source
        run: |
          python3 .github/agent_server_postgres_tls_patch.py
          cargo fmt --all
          cargo check -p aidememo-store-postgres -p aidememo-server --all-features
          git diff --check

      - name: Commit source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- Cargo.lock \
            crates/aidememo-store-postgres/Cargo.toml \
            crates/aidememo-store-postgres/src/lib.rs \
            crates/aidememo-store-postgres/tests/tls.rs \
            crates/aidememo-server/src/executor.rs \
            crates/aidememo-server/src/lib.rs \
            crates/aidememo-server/src/main.rs \
            crates/aidememo-server/tests/postgres_tls_http.rs
          git commit -m 'feat: require verified TLS for PostgreSQL production profile'
          git push origin HEAD:agent/server-postgres-tls
