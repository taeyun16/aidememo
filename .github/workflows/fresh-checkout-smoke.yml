name: fresh checkout smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fresh-checkout-smoke.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/postgres-identity-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/postgres-identity-store
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format identity sources
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit source-only formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/aidememo-domain/src/identity_conformance.rs crates/aidememo-store-local/src/server_identity.rs crates/aidememo-store-postgres/tests/postgres_identity.rs
          git commit -m 'style: format portable identity conformance'
          git push origin HEAD:agent/postgres-identity-store
