name: fresh checkout smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fresh-checkout-smoke.yml"

permissions:
  contents: read

jobs:
  inspect-server-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect concrete server storage coupling
        run: |
          echo '=== direct service access ==='
          grep -RIn -C 8 -E 'state\.service|CommandService<SqliteCommandStore>' crates/aidememo-server/src || true
          echo '=== helper signatures ==='
          grep -RIn -C 5 'CommandService<' crates/aidememo-server/src || true
