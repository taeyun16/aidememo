name: fresh checkout smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fresh-checkout-smoke.yml"

permissions:
  contents: write

jobs:
  normalize-server-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/server-postgres-executor
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Normalize source and lockfile
        run: |
          cargo fmt --all
          cargo check -p aidememo-server
          git diff --check
      - name: Commit normalized source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/aidememo-server/src/executor.rs crates/aidememo-server/tests/blocking_executor.rs crates/aidememo-server/tests/postgres_executor.rs
          git commit -m 'style: normalize bounded server executor'
          git push origin HEAD:agent/server-postgres-executor
