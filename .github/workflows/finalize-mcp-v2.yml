name: finalize HTTP MCP v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

# Temporary workflow; it removes itself after writing the validated product diff.
jobs:
  finalize:
    if: github.head_ref == 'agent/http-mcp-gateway-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/http-mcp-gateway-v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Integrate and validate MCP v2
        run: |
          python3 .github/scripts/finalize_mcp_v2.py
          cargo fmt --all
          cargo check -p aidememo-server
          cargo check -p aidememo-server --features semantic
          cargo test -p aidememo-server --test mcp_http
          cargo test -p aidememo-server --features semantic --test mcp_http
          cargo clippy -p aidememo-server --all-targets --features semantic -- -D warnings
          rm .github/scripts/finalize_mcp_v2.py .github/workflows/finalize-mcp-v2.yml
          git diff --check
      - name: Commit final product diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: finalize authenticated HTTP MCP gateway'
          git push origin HEAD:agent/http-mcp-gateway-v2
