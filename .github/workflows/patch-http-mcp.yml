name: patch HTTP MCP gateway

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/http-mcp-core-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/http-mcp-core-final
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: |
          cargo fmt --all
          rm .github/workflows/patch-http-mcp.yml
          git diff --check
      - name: Commit formatted final diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: format authenticated HTTP MCP gateway'
          git push origin HEAD:agent/http-mcp-core-final
