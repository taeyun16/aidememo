name: patch HTTP MCP gateway

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/http-mcp-gateway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/http-mcp-gateway
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Integrate and validate MCP gateway
        run: |
          python3 .github/scripts/patch_http_mcp.py
          cargo fmt --all
          cargo check -p aidememo-server
          cargo test -p aidememo-server --test mcp_http
          cargo clippy -p aidememo-server --all-targets -- -D warnings
          git diff --check
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/aidememo-server
          git commit -m 'feat: integrate stateless HTTP MCP gateway'
          git push origin HEAD:agent/http-mcp-gateway
