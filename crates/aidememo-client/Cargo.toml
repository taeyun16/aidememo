[package]
name = "aidememo-client"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Authenticated remote transport and local replica cache for AideMemo SSOT mode"
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[dependencies]
aidememo-domain = { version = "0.1.0", path = "../aidememo-domain" }
percent-encoding = "2.3"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
