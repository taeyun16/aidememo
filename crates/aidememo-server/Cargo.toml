[package]
name = "aidememo-server"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Authenticated single-node HTTP server foundation for AideMemo SSOT mode"
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[features]
default = []
s3 = ["aidememo-artifacts/s3", "dep:aws-credential-types", "dep:aws-sdk-s3"]

[[bin]]
name = "aidememo-server"
path = "src/main.rs"

[dependencies]
aidememo-artifacts = { version = "0.1.0", path = "../aidememo-artifacts" }
aidememo-domain = { version = "0.1.0", path = "../aidememo-domain" }
aidememo-service = { version = "0.1.0", path = "../aidememo-service" }
aidememo-store-local = { version = "0.1.0", path = "../aidememo-store-local" }
aws-credential-types = { version = "1.2.14", optional = true }
aws-sdk-s3 = { version = "1.136.0", optional = true, default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.35", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1.1"

[dev-dependencies]
aidememo-client = { path = "../aidememo-client" }
tempfile = "3.10"

[lints]
workspace = true
